services:
  postgres:
    image: postgres:16-alpine
    container_name: paypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paypilot
      POSTGRES_PASSWORD: YOUR_PASSWORD
      POSTGRES_DB: paypilot
    ports:
      - "5432:5432"
    volumes:
      - paypilot_pgdata:/var/lib/postgresql/data

volumes:
  paypilot_pgdata:

