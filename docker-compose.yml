services:
  postgres:
    image: postgres:16-alpine
    container_name: paypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paypilot_password}
      POSTGRES_DB: ${POSTGRES_DB:-paypilot}
    ports:
      - "5432:5432"
    volumes:
      - paypilot_pgdata:/var/lib/postgresql/data

volumes:
  paypilot_pgdata:

