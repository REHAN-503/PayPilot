services:
  # Backend API Gateway (NestJS)
  - type: web
    name: paypilot-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: pnpm install && pnpm --filter api exec prisma generate --schema prisma/schema.prisma && pnpm --filter api build
    startCommand: pnpm --filter api start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: paypilot-postgres
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://paypilot-api-85n1.onrender.com
      - key: WEB_ORIGIN
        value: https://paypilot-web-4jd8.onrender.com
      - key: DEMO_MODE
        value: "false"
      - key: LLM_FORCE_LIVE
        value: "true"
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PAYPAL_API_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CURRENCY
        value: USD
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  # Frontend Web UI (Next.js 16)
  - type: web
    name: paypilot-web
    runtime: node
    plan: free
    region: ohio
    buildCommand: pnpm install && pnpm --filter web build
    startCommand: pnpm --filter web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        value: https://paypilot-api-85n1.onrender.com
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CURRENCY
        value: USD

